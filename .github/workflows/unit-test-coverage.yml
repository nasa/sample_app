name: Unit Test and Coverage

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
  schedule:
    # 10:50 PM UTC every Sunday
    - cron:  '50 22 * * 0'

permissions:
  contents: read

jobs:
  unit-test-coverage:
    name: Run unit test and coverage
    uses: nasa/cFS/.github/workflows/unit-test-coverage-reusable.yml@dev
    with:
      dependency: nasa/sample_lib